name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: sprint-zero
  REGION: asia-south1
  SERVICE: sprintzero
  SERVICE_ACCOUNT: sprint-zero-server@sprint-zero.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/405521331/locations/global/workloadIdentityPools/github-pool/providers/github-provider

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sprintzero/app:${{ github.sha }} .

      - name: Push image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sprintzero/app:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sprintzero/app:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --set-env-vars="NODE_ENV=production,FIRESTORE_DATABASE_ID=sprint-zero-db,GOOGLE_REDIRECT_URI=https://sprintzero-405521331.asia-south1.run.app/api/auth/callback" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,SESSION_SECRET=SESSION_SECRET:latest,TOKEN_ENC_KEY=TOKEN_ENC_KEY:latest"